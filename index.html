<!-- 
  SORPRESA PARA FRECIA — 4 estaciones, una por cada Bon o Bon.
  Cómo usar:
  - Este archivo se sube a un hosting gratuito (Netlify Drop, GitHub Pages, etc.)
  - El enlace final + "?e=1" muestra la estación 1, "?e=2" la estación 2, etc.
  - Genera un QR por cada uno de esos 4 enlaces y pégalo junto al chocolate correspondiente.

  EDITA AQUÍ lo que quieras personalizar más: busca los comentarios "EDITAR:"
-->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Frecia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --plum: #3B1520;
    --plum-deep: #2A0F17;
    --paper: #F8F1E4;
    --paper-soft: #F1E7D6;
    --rose: #A73B49;
    --gold: #C9A227;
    --blush: #E9C6C9;
    --ink: #2B2320;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background: var(--plum);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201,162,39,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(233,198,201,0.08), transparent 45%);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }
  .letter{
    position:relative;
    width:100%;
    max-width: 520px;
    background: var(--paper);
    border-radius: 2px;
    padding: 48px 40px 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }
  .letter::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height: 10px;
    background:
      linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0/16px 16px repeat-x,
      linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0/16px 16px repeat-x;
    background-color: var(--plum);
    top:-9px;
  }
  .seal{
    width:56px; height:56px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--rose), var(--plum-deep) 75%);
    color: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif;
    font-size: 22px;
    font-weight:600;
    margin: 0 auto 22px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25) inset, 0 3px 6px rgba(0,0,0,0.3);
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight:600;
    font-size: clamp(28px, 6vw, 38px);
    line-height:1.15;
    text-align:center;
    margin: 0 0 6px;
    color: var(--plum-deep);
  }
  .eyebrow{
    text-align:center;
    font-size:13px;
    letter-spacing:0.02em;
    color: var(--rose);
    margin: 0 0 28px;
    font-weight:500;
  }
  p{
    font-size:16px;
    line-height:1.65;
    max-width: 46ch;
    margin: 0 auto 16px;
  }
  .center{ text-align:center; }
  .divider{
    width:64px; height:2px;
    background: var(--gold);
    margin: 26px auto;
    border:none;
    opacity:0.6;
  }
  .quiz{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top: 22px;
  }
  .quiz button{
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:500;
    background: var(--paper-soft);
    border: 1px solid rgba(59,21,32,0.15);
    color: var(--ink);
    padding: 13px 16px;
    border-radius: 3px;
    cursor:pointer;
    text-align:left;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .quiz button:hover{ background: var(--blush); border-color: var(--rose); }
  .feedback{
    text-align:center;
    margin-top:18px;
    font-size:15px;
    min-height: 22px;
    color: var(--rose);
    font-weight:500;
  }
  .hint{
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(59,21,32,0.12);
    text-align:center;
    font-size: 14px;
    color: rgba(43,35,32,0.65);
    font-style: italic;
  }
  .final-wrap{ position:relative; overflow:hidden; }
  canvas#confetti{
    position:fixed; inset:0; pointer-events:none; z-index:5;
  }
  .home-list{
    list-style:none; padding:0; margin: 18px 0 0;
    display:flex; flex-direction:column; gap:8px;
  }
  .home-list li{
    font-size:14px; color: rgba(43,35,32,0.7);
    background: var(--paper-soft);
    border-radius:3px; padding:10px 14px;
  }
  code{ color: var(--rose); }
</style>
</head>
<body>
<div class="letter" id="letter"></div>
<canvas id="confetti" style="display:none;"></canvas>

<script>
const params = new URLSearchParams(window.location.search);
const e = params.get('e');
const el = document.getElementById('letter');

function render(html){ el.innerHTML = html; }

// ---------- ESTACIÓN 1 ----------
function estacion1(){
  render(`
    <div class="seal">F</div>
    <p class="eyebrow">Bon o Bon nº 1</p>
    <h1>Hace tres años</h1>
    <hr class="divider">
    <p>Frecia,</p>
    <p>
      <!-- EDITAR: cambia este párrafo por el recuerdo real de cómo se conocieron -->
      hace tres años el mundo decidió cruzarnos sin avisarnos. Ninguno de los
      dos sabía, en ese momento, que ese cruce iba a llegar hasta aquí. Han
      pasado tres años desde ese día, y apenas un mes desde que decidimos
      llamarle a esto lo que realmente es.
    </p>
    <p>Esta es la primera de cuatro paradas. Guarda este momento y sigue el rastro.</p>
    <div class="hint">Pista: busca el segundo Bon o Bon donde tomamos nuestro primer café.</div>
  `);
}

// ---------- ESTACIÓN 2 (trivia) ----------
function estacion2(){
  render(`
    <div class="seal">F</div>
    <p class="eyebrow">Bon o Bon nº 2</p>
    <h1>Una pregunta rápida</h1>
    <hr class="divider">
    <p class="center">Antes de seguir, respóndeme esto:</p>
    <!-- EDITAR: cambia la pregunta y las opciones por algo específico de ustedes -->
    <p class="center" style="font-weight:600;">¿Hace cuánto que somos novios?</p>
    <div class="quiz">
      <button onclick="responder(this,false)">Seis meses</button>
      <button onclick="responder(this,true)">Un mes</button>
      <button onclick="responder(this,false)">Un año</button>
    </div>
    <div class="feedback" id="fb"></div>
  `);
}
function responder(btn, correcta){
  const fb = document.getElementById('fb');
  document.querySelectorAll('.quiz button').forEach(b=>b.disabled=true);
  if(correcta){
    btn.style.background = 'var(--blush)';
    btn.style.borderColor = 'var(--rose)';
    fb.textContent = 'Exacto. Un mes, y se ha sentido mejor que muchos años.';
    setTimeout(()=>{
      fb.innerHTML += '<div class="hint" style="margin-top:16px;border-top:none;padding-top:0;">Pista: el tercer Bon o Bon está donde guardas las cosas que más quieres.</div>';
    }, 900);
  } else {
    fb.textContent = 'No es esa... pero igual sigamos.';
    setTimeout(estacion2, 1100);
  }
}

// ---------- ESTACIÓN 3 (carta) ----------
function estacion3(){
  render(`
    <div class="seal">F</div>
    <p class="eyebrow">Bon o Bon nº 3</p>
    <h1>Lo que quiero decirte</h1>
    <hr class="divider">
    <!-- EDITAR: esta es la carta más personal, cámbiala por tus propias palabras -->
    <p>
      No necesito una fecha especial para decirte esto, pero hoy es un buen
      día para hacerlo de todas formas: contigo las cosas se sienten simples,
      incluso cuando no lo son. Un mes no es mucho tiempo, pero contigo se
      siente como si estuviéramos construyendo algo que va a durar.
    </p>
    <p class="center" style="font-style:italic;">Gracias por decir que sí a esto.</p>
    <div class="hint">Pista: el último Bon o Bon está conmigo. Ven a buscarlo.</div>
  `);
}

// ---------- ESTACIÓN 4 (cierre) ----------
function estacion4(){
  render(`
    <div class="seal">F</div>
    <p class="eyebrow">Bon o Bon nº 4 — el último</p>
    <h1>Llegaste</h1>
    <hr class="divider">
    <p class="center">
      <!-- EDITAR: cierre — puedes poner una fecha, una invitación, o simplemente esto -->
      Cuatro chocolates, tres años, un mes, y esto apenas empieza.
    </p>
    <p class="center" style="font-weight:600; color:var(--rose);">Feliz un mes, Frecia.</p>
  `);
  launchConfetti();
}

// ---------- HOME (sin parámetro, para pruebas) ----------
function home(){
  render(`
    <div class="seal">F</div>
    <p class="eyebrow">Vista previa</p>
    <h1>4 estaciones</h1>
    <hr class="divider">
    <p class="center">Comparte cada uno de estos enlaces como un código QR distinto:</p>
    <ul class="home-list">
      <li>Estación 1 — <code>?e=1</code></li>
      <li>Estación 2 — <code>?e=2</code></li>
      <li>Estación 3 — <code>?e=3</code></li>
      <li>Estación 4 — <code>?e=4</code></li>
    </ul>
  `);
}

function launchConfetti(){
  const canvas = document.getElementById('confetti');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ['#A73B49','#C9A227','#E9C6C9','#F8F1E4'];
  let pieces = Array.from({length:120}, () => ({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height,
    r: 4 + Math.random()*5,
    c: colors[Math.floor(Math.random()*colors.length)],
    vy: 2 + Math.random()*3,
    vx: -1 + Math.random()*2,
    rot: Math.random()*Math.PI,
    vrot: -0.1 + Math.random()*0.2
  }));
  let frames = 0;
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.y += p.vy; p.x += p.vx; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      ctx.restore();
    });
    frames++;
    if(frames < 340) requestAnimationFrame(tick);
    else canvas.style.display='none';
  }
  tick();
}

if(e === '1') estacion1();
else if(e === '2') estacion2();
else if(e === '3') estacion3();
else if(e === '4') estacion4();
else home();
</script>
</body>
</html>
