<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Frecia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --plum: #3B1520;
    --plum-deep: #2A0F17;
    --paper: #F8F1E4;
    --paper-soft: #F1E7D6;
    --rose: #A73B49;
    --gold: #C9A227;
    --blush: #E9C6C9;
    --ink: #2B2320;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background: var(--plum);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(201,162,39,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(233,198,201,0.08), transparent 45%);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }
  .letter{
    position:relative;
    width:100%;
    max-width: 520px;
    background: var(--paper);
    border-radius: 2px;
    padding: 48px 40px 40px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }
  .letter::before{
    content:"";
    position:absolute;
    top:-9px; left:0; right:0;
    height: 10px;
    background:
      linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0/16px 16px repeat-x,
      linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0/16px 16px repeat-x;
    background-color: var(--plum);
  }
  .seal{
    width:56px; height:56px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--rose), var(--plum-deep) 75%);
    color: var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif;
    font-size: 22px;
    font-weight:600;
    margin: 0 auto 22px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.25) inset, 0 3px 6px rgba(0,0,0,0.3);
  }
  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight:600;
    font-size: clamp(28px, 6vw, 38px);
    line-height:1.15;
    text-align:center;
    margin: 0 0 6px;
    color: var(--plum-deep);
  }
  .eyebrow{
    text-align:center;
    font-size:13px;
    letter-spacing:0.02em;
    color: var(--rose);
    margin: 0 0 28px;
    font-weight:500;
  }
  p{
    font-size:16px;
    line-height:1.65;
    max-width: 46ch;
    margin: 0 auto 16px;
  }
  .center{ text-align:center; }
  .divider{
    width:64px; height:2px;
    background: var(--gold);
    margin: 26px auto;
    border:none;
    opacity:0.6;
  }
  .quiz{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top: 22px;
  }
  .quiz button{
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:500;
    background: var(--paper-soft);
    border: 1px solid rgba(59,21,32,0.15);
    color: var(--ink);
    padding: 13px 16px;
    border-radius: 3px;
    cursor:pointer;
    text-align:left;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .quiz button:hover{ background: var(--blush); border-color: var(--rose); }
  .feedback{
    text-align:center;
    margin-top:18px;
    font-size:15px;
    min-height: 22px;
    color: var(--rose);
    font-weight:500;
  }
  .hint{
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(59,21,32,0.12);
    text-align:center;
    font-size: 14px;
    color: rgba(43,35,32,0.65);
    font-style: italic;
  }
  canvas#confetti{
    position:fixed; inset:0; pointer-events:none; z-index:5;
  }
</style>
</head>
<body>
<div class="letter" id="letter">
  <div class="seal">F</div>
  <p class="eyebrow">Bon o Bon nº 2</p>
  <h1>Una pregunta rápida</h1>
  <hr class="divider">
  <p class="center">Antes de seguir, respóndeme esto:</p>
  <!-- EDITAR: cambia la pregunta y las opciones por algo específico de ustedes -->
  <p class="center" style="font-weight:600;">¿Qué día decidimos que sea nuestra fecha?</p>
  <div class="quiz">
    <button onclick="responder(this,false)">15 de Agosto</button>
    <button onclick="responder(this,true)">19 de Agosto</button>
    <button onclick="responder(this,false)">10 de Agosto</button>
  </div>
  <div class="feedback" id="fb"></div>
</div>
<script>
function responder(btn, correcta){
  const fb = document.getElementById('fb');
  document.querySelectorAll('.quiz button').forEach(b=>b.disabled=true);
  if(correcta){
    btn.style.background = 'var(--blush)';
    btn.style.borderColor = 'var(--rose)';
    fb.textContent = 'Exacto. Luego de ese día parecerí que fueron muchos años.';
    setTimeout(()=>{
      fb.innerHTML += '<div class="hint" style="margin-top:16px;border-top:none;padding-top:0;">Como premio por acertar, tienes un pequeño regalo: <a href="https://heart-sparkle--sebasperezbrion.replit.app" target="_blank" rel="noopener" style="color:var(--rose); font-weight:600;">ábrelo aquí</a>.</div><div class="hint">Pista: el tercer Bon o Bon está donde guardas las cosas que más quieres.</div>';
    }, 900);
  } else {
    fb.textContent = 'No es esa... pero igual sigamos, vuelve a intentar.';
    setTimeout(()=>{
      document.querySelectorAll('.quiz button').forEach(b=>b.disabled=false);
      fb.textContent = '';
    }, 1100);
  }
}
</script>
</body>
</html>
